name: Deploy Shaagher Web to Hostinger

on:
  push:
    branches:
      - main # يتم التشغيل التلقائي عند عمل Push على فرع main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📝 Create .env file
        run: |
          echo "PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}" >> .env
          echo "PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: 🏗️ Build Astro Project
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 🚀 Deploy to Hostinger via WebDAV (Web Disk)
        run: |
          # Install rclone for WebDAV sync
          sudo apt-get update && sudo apt-get install -y rclone
          
          # Obscure the password for rclone
          OBSCURED_PASS=$(rclone obscure "${{ secrets.FTP_PASSWORD }}")
          
          # Configure rclone via environment variables
          export RCLONE_CONFIG_CPANEL_TYPE=webdav
          export RCLONE_CONFIG_CPANEL_URL="https://${{ secrets.FTP_SERVER }}:2078"
          export RCLONE_CONFIG_CPANEL_VENDOR=other
          export RCLONE_CONFIG_CPANEL_USER="${{ secrets.FTP_USERNAME }}"
          export RCLONE_CONFIG_CPANEL_PASS="$OBSCURED_PASS"
          
          # Sync the dist folder to public_html/shaghir.zimamak.com
          rclone sync ./dist/ cpanel:public_html/shaghir.zimamak.com/ --no-check-certificate --timeout 5m --contimeout 30s -v -I
          rclone sync ./dist/ cpanel:public_html/shaghir/ --no-check-certificate --timeout 5m --contimeout 30s -v -I
